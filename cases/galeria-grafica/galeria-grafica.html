  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/syne@latest/latin-800.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@latest/latin-400.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@latest/latin-500.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/space-mono@latest/latin-400.css">

<body>
  <div class="noise" aria-hidden="true"></div>
  <div class="scanlines" aria-hidden="true"></div>

  <header>
    <div class="wrap case-top">
      <a class="back" href="../../index.html"><i aria-hidden="true">←</i> VOLTAR AO ÍNDICE</a>
      <a class="logo" href="../../index.html"><b aria-hidden="true">▮</b> L.BRUNINI</a>
    </div>
  </header>

  <main class="wrap">
    <div class="case-hero">
      <span class="case-code">// SELEÇÃO — DESIGN GRÁFICO</span>
      <p class="update-notice">Esta página está sendo atualizada.</p>
      <h1>Galeria <span class="title-accent">Gráfica</span></h1>
    </div>

    <section class="gallery-section" aria-labelledby="pecas-graficas-titulo">
      <div class="section-heading">
        <span class="section-code">// TIPO_01</span>
        <h2 id="pecas-graficas-titulo">Peças Gráficas</h2>
      </div>
      <div class="gallery-grid">
        <figure class="gallery-item">
          <button class="gallery-trigger" type="button"
            data-full="../../assets/imagens/galeria-grafica/pecas-graficas/peca-base-v5.png"
            data-alt="Peça Base, versão 5"
            data-category="PEÇAS GRÁFICAS"
            aria-label="Ampliar Peça Base, versão 5">
            <img src="../../assets/imagens/galeria-grafica/pecas-graficas/peca-base-v5.png" alt="Peça Base, versão 5" loading="lazy">
            <span class="image-hud" aria-hidden="true">DESIGN GRÁFICO // PEÇA_01</span>
            <span class="image-expand" aria-hidden="true">↗</span>
          </button>
          <figcaption class="gallery-caption">Peça gráfica para peça teatral.</figcaption>
        </figure>
        <figure class="gallery-item">
          <button class="gallery-trigger" type="button"
            data-full="../../assets/imagens/galeria-grafica/pecas-graficas/peca-base-oficina-v1.png"
            data-alt="Peça Base para oficina, versão 1"
            data-category="PEÇAS GRÁFICAS"
            aria-label="Ampliar Peça Base para oficina, versão 1">
            <img src="../../assets/imagens/galeria-grafica/pecas-graficas/peca-base-oficina-v1.png" alt="Peça Base para oficina, versão 1" loading="lazy">
            <span class="image-hud" aria-hidden="true">DESIGN GRÁFICO // PEÇA_02</span>
            <span class="image-expand" aria-hidden="true">↗</span>
          </button>
          <figcaption class="gallery-caption">Peça gráfica para oficina teatral.</figcaption>
        </figure>
        <figure class="gallery-item">
          <button class="gallery-trigger" type="button"
            data-full="../../assets/imagens/galeria-grafica/pecas-graficas/POSTER%20Manera%20sencill%C3%ADsima%20de%20destruir%20una%20ciudad%20.png"
            data-alt="Pôster: Manera sencillísima de destruir una ciudad"
            data-category="PEÇAS GRÁFICAS"
            aria-label="Ampliar pôster Manera sencillísima de destruir una ciudad">
            <img src="../../assets/imagens/galeria-grafica/pecas-graficas/POSTER%20Manera%20sencill%C3%ADsima%20de%20destruir%20una%20ciudad%20.png" alt="Pôster: Manera sencillísima de destruir una ciudad" loading="lazy">
            <span class="image-hud" aria-hidden="true">DESIGN GRÁFICO // PEÇA_03</span>
            <span class="image-expand" aria-hidden="true">↗</span>
          </button>
          <figcaption class="gallery-caption">Pôster: Manera sencillísima de destruir una ciudad (filme independente).</figcaption>
        </figure>
        <figure class="gallery-item">
          <a class="gallery-trigger gallery-trigger-pdf"
            href="../../assets/imagens/galeria-grafica/pecas-graficas/o-sonho-de-um-palhaco-do-sertao.pdf"
            target="_blank" rel="noopener"
            aria-label="Abrir PDF de O sonho de um palhaço do sertão em uma nova aba">
            <img src="../../assets/imagens/galeria-grafica/pecas-graficas/o-sonho-de-um-palhaco-do-sertao.png" alt="O sonho de um palhaço do sertão" loading="lazy">
            <span class="image-hud" aria-hidden="true">DESIGN GRÁFICO // PEÇA_04</span>
            <span class="image-expand" aria-hidden="true">↗</span>
          </a>
          <figcaption class="gallery-caption">Peça gráfica de portfólio de solo artístico. Clique para abrir o PDF em uma nova aba.</figcaption>
        </figure>
      </div>
    </section>

    <section class="gallery-section" aria-labelledby="branding-titulo">
      <div class="section-heading">
        <span class="section-code">// TIPO_02</span>
        <h2 id="branding-titulo">Branding</h2>
      </div>
      <div class="gallery-grid">
        <figure class="gallery-item">
          <button class="gallery-trigger" type="button"
            data-full="../../assets/imagens/galeria-grafica/branding/cachorro-punk.png"
            data-alt="Identidade visual Cachorro Punk"
            data-category="BRANDING"
            aria-label="Ampliar identidade visual Cachorro Punk">
            <img src="../../assets/imagens/galeria-grafica/branding/cachorro-punk.png" alt="Identidade visual Cachorro Punk" loading="lazy">
            <span class="image-hud" aria-hidden="true">BRANDING // PROJETO_01</span>
            <span class="image-expand" aria-hidden="true">↗</span>
          </button>
          <figcaption class="gallery-caption">Cachorro Punk Quadrinhos. Ilustração por Wellington Araujo.</figcaption>
        </figure>
        <figure class="gallery-item">
          <button class="gallery-trigger" type="button"
            data-full="../../assets/imagens/galeria-grafica/branding/forja.png"
            data-alt="Identidade visual Forja"
            data-category="BRANDING"
            aria-label="Ampliar identidade visual Forja">
            <img src="../../assets/imagens/galeria-grafica/branding/forja.png" alt="Identidade visual Forja" loading="lazy">
            <span class="image-hud" aria-hidden="true">BRANDING // PROJETO_02</span>
            <span class="image-expand" aria-hidden="true">↗</span>
          </button>
          <figcaption class="gallery-caption">App Forja.</figcaption>
        </figure>
      </div>
    </section>
  </main>

  <div class="gallery-modal" id="galleryModal" role="dialog" aria-modal="true" aria-hidden="true" aria-label="Visualização da galeria gráfica" inert>
    <div class="gallery-modal-panel">
      <div class="gallery-meta" id="galleryMeta">GALERIA GRÁFICA // PEÇAS GRÁFICAS</div>
      <button class="gallery-close" type="button" aria-label="Fechar visualização">✕</button>
      <button class="gallery-nav gallery-prev" type="button" aria-label="Imagem anterior">←</button>
      <div class="gallery-counter" id="galleryCounter" aria-live="polite"></div>
      <img id="galleryImage" src="" alt="">
      <button class="gallery-nav gallery-next" type="button" aria-label="Próxima imagem">→</button>
    </div>
  </div>

  <footer class="wrap">© <span id="year"></span> // LUCAS BRUNINI · DESIGN GRÁFICO</footer>

  <script>
    (function(){
      'use strict';

      var modal = document.getElementById('galleryModal');
      var modalImage = document.getElementById('galleryImage');
      var counter = document.getElementById('galleryCounter');
      var galleryMeta = document.getElementById('galleryMeta');
      var closeButton = document.querySelector('.gallery-close');
      var cards = Array.prototype.slice.call(document.querySelectorAll('button.gallery-trigger'));
      var currentIndex = 0;
      var lastTrigger = null;

      function updateGallery(index) {
        currentIndex = (index + cards.length) % cards.length;
        modalImage.src = cards[currentIndex].getAttribute('data-full');
        modalImage.alt = cards[currentIndex].getAttribute('data-alt');
        galleryMeta.textContent = 'GALERIA GRÁFICA // ' + cards[currentIndex].getAttribute('data-category');
        counter.textContent = (currentIndex + 1).toString().padStart(2, '0') + ' / ' + cards.length.toString().padStart(2, '0');
      }

      function openGallery(index) {
        if (!cards.length) return;
        lastTrigger = cards[index];
        updateGallery(index);
        modal.classList.add('is-open');
        modal.setAttribute('aria-hidden', 'false');
        modal.inert = false;
        document.body.style.overflow = 'hidden';
        closeButton.focus();
      }

      function closeGallery() {
        modal.classList.remove('is-open');
        modal.setAttribute('aria-hidden', 'true');
        modal.inert = true;
        document.body.style.overflow = '';
        if (lastTrigger) lastTrigger.focus();
      }

      cards.forEach(function(card, index) {
        card.addEventListener('click', function(){ openGallery(index); });
      });

      closeButton.addEventListener('click', closeGallery);
      document.querySelector('.gallery-prev').addEventListener('click', function(){ updateGallery(currentIndex - 1); });
      document.querySelector('.gallery-next').addEventListener('click', function(){ updateGallery(currentIndex + 1); });

      modal.addEventListener('click', function(event) {
        if (event.target === modal) closeGallery();
      });

      document.addEventListener('keydown', function(event) {
        if (modal.getAttribute('aria-hidden') === 'true') return;
        if (event.key === 'Escape') closeGallery();
        if (event.key === 'ArrowLeft') {
          event.preventDefault();
          updateGallery(currentIndex - 1);
        }
        if (event.key === 'ArrowRight') {
          event.preventDefault();
          updateGallery(currentIndex + 1);
        }
        if (event.key === 'Tab') {
          var focusable = [closeButton, document.querySelector('.gallery-prev'), document.querySelector('.gallery-next')];
          var first = focusable[0];
          var last = focusable[focusable.length - 1];
          if (event.shiftKey && document.activeElement === first) {
            event.preventDefault();
            last.focus();
          } else if (!event.shiftKey && document.activeElement === last) {
            event.preventDefault();
            first.focus();
          }
        }
      });

      document.getElementById('year').textContent = new Date().getFullYear();
    })();
  </script>
</body>
</html>
